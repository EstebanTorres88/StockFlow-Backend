services:
  mysql:
    image: docker.io/library/mysql:8.0
    container_name: stockflow-db

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stockFlow
      MYSQL_USER: stockFlow
      MYSQL_PASSWORD: stockFlow88

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: